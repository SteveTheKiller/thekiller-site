  - id: scripts
    label: Scripts and modules
    blurb: >-
      The field work that started all of it. PowerShell written for real tickets
      on real networks, then cleaned up and published.
    # The two published modules; the scripts hang off KillerScripts in the
    # flowchart on /software/. Script names mirror the killer-scripts repo's
    # descriptions.json - refresh here when a script is added there.
    modules:
      # Descriptions are Steve's own, from killer-modules.vue on killertools.net.
      - name: KillerPivot
        expansion: Per-Identity Validated Org-Toggle
        install: Install-Module KillerPivot -Scope CurrentUser
        # The module title links to the Gallery listing it installs from
        url: https://www.powershellgallery.com/packages/KillerPivot
        blurb: >-
          Switch between Microsoft 365 tenants in PowerShell without firing
          commands at the wrong one. It disables the auth broker to force a real
          sign-in prompt, then asks the session which tenant it actually landed
          in and verifies it before you touch anything.
      - name: KillerScripts
        install: Install-Module KillerScripts -Scope CurrentUser
        url: https://www.powershellgallery.com/packages/KillerScripts
        blurb: >-
          Every tool in the killer-scripts repo, available as a command in any
          PowerShell session. Each script is pulled fresh from GitHub the moment
          you run it, with a local cache as an offline fallback. All 18 get their
          own command and a short alias, so typing urt runs the Universal Rename
          Tool.
    scripts:
      - name: AMORT
        rule: [cyan, white, yellow, darkgray]
        accent: yellow
        term: cyan
        title: "Advanced Maintenance, Optimization, and Repair Tool"
        desc: "Automated Windows 10/11 tune-up for MSP field and remote deployment."
      - name: BEAM
        rule: [darkcyan, white, yellow, darkgray]
        accent: yellow
        term: darkcyan
        title: "Bulk Endpoint App Mover"
        desc: "Deploys any .exe or .msi to Entra-joined devices as an Intune Win32 app."
      - name: BERET
        rule: [red, white, yellow, darkgray]
        accent: yellow
        term: red
        title: "BitLocker Encryption, Recovery, & Escrow Tool"
        desc: "Interactive BitLocker lifecycle manager with TPM enforcement and AD/Entra ID key escrow."
      - name: DEBLOAT
        rule: [white, darkred, yellow, darkgray]
        accent: yellow
        term: darkred
        title: "Deployment Environment Bloatware Liquidator & Optimized Automated Toolkit"
        desc: "Standardizes Windows 11 by removing OEM bloat and enforcing privacy and UI hardening."
      - name: DEFEND
        rule: [cyan, white, cyan, darkgray]
        accent: cyan
        title: "Definition Enforcement & Full Endpoint Network Defense"
        desc: "Audits kernel-level security including TPM, Secure Boot, HVCI, and Defender."
      - name: DEPOT
        rule: [darkred, yellow, yellow, darkgray]
        accent: yellow
        term: darkred
        title: "Deployment & Endpoint Provisioning Operations Tool"
        desc: "Full new-machine provisioning with silent app deployment and self-delete on completion."
      - name: FACTS
        rule: [magenta, yellow, green, darkgray]
        accent: green
        title: "Foxit Audit and Control Task Script"
        desc: "Audits Foxit PDF installations and permanently blocks auto-updates via registry hardening."
      - name: MACE
        rule: [red, white, red, darkgray]
        accent: red
        title: "Microsoft Application Cleanse & Eradication"
        desc: "Completely removes OneDrive, New Outlook, Office/M365, and Teams from a Windows endpoint."
      - name: ODD
        rule: [magenta, yellow, darkgray]
        accent: yellow
        term: magenta
        title: "Output Device Diagnostic"
        desc: "Inventories all physical, USB, and Bluetooth audio devices with health status and driver info."
      - name: ORCA
        rule: [cyan, white, yellow, darkgray]
        accent: yellow
        term: cyan
        title: "Outlook Reset & Configuration Assistant"
        desc: "Resets broken Outlook installations for one or all user profiles, classic or new."
      - name: PRINT
        rule: [green, darkyellow, darkgray]
        accent: yellow
        term: darkgreen
        title: "Printer Response & Interface Network Tool"
        desc: "Printer management utility with network scanner, driver matching, and UNC path support."
      - name: PRUNE
        rule: [darkgreen, red, darkgray]
        accent: yellow
        term: darkgreen
        title: "Profile Removal Utility for Neglected Entries"
        desc: "Interactive editor for managing Windows user profiles."
      - name: SHADE
        rule: [magenta, white, cyan, darkgray]
        accent: cyan
        title: "System Hardening Against Data Exposure"
        desc: "Windows 10/11 privacy hardening that disables telemetry, tracking, advertising, and phone-home behavior."
      - name: STARE
        rule: [darkred, magenta, darkmagenta, darkgray, red]
        accent: magenta
        term: magenta
        title: "Scheduled Task Administration & Routine Executor"
        desc: "Interactive terminal wizard for fast and reliable Windows Scheduled Task management."
      - name: TICK
        rule: [darkmagenta, darkgreen, darkmagenta, darkgray]
        accent: darkgreen
        title: "Trigger Immediate Clock Kickstart"
        desc: "Resets and re-syncs Windows Time service against a chosen NTP peer with before/after reporting."
      - name: URT
        rule: [green, darkcyan, yellow, darkgray]
        accent: yellow
        term: green
        title: "Universal Rename Tool"
        desc: "Renames local or domain-joined computers from an admin shell with no GUI popups."
      - name: VITALS
        rule: [green, yellow, darkgray]
        accent: green
        term: green
        title: "Visual Interface for Technical Asset & Logistics Summary"
        desc: "Collects and displays a full hardware and network snapshot including BitLocker, TPM, and domain info."
      - name: WURSA
        rule: [red, white, cyan, darkgray]
        accent: yellow
        term: red
        title: "Windows Update, Repair, & System Alignment"
        desc: "Enforces OS patches, OEM driver updates, and third-party app upgrades via Chocolatey."

