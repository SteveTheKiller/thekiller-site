sections:

  - id: apps
    label: Windows apps
    blurb: >-
      Five native Windows applications. Each one ships as a single
      self-contained exe, runs portable or installs itself, is code-signed and
      verified in-app, is localized, and is GPLv3. No account, no
      subscription, no telemetry.
    items:

      - name: KillerPDF
        slug: killerpdf
        shots: 4
        screenshot_files: ["01.png", "02.png", "03.png", "04.png"]
        tagline: Free PDF editor
        version: 1.7.3
        released: 2026-08-15
        url: https://killerpdf.net
        engine: https://killerpdf.net/engine/
        corpus: https://killerpdf.net/corpus.html
        repo: https://github.com/SteveTheKiller/KillerPDF
        stack: [C#, WPF, .NET Framework 4.8, PDFium, Tesseract]
        blurb: >-
          Views, edits, OCRs, fills and signs. Four view modes across unlimited
          tabs, split panes, in-place text editing, annotations, forms and
          digital signatures, page organization and print preview.
        # FILLER, condensed from pdf-landing/about.html. Replace with final copy.
        why: >-
          I got tired of closing the same Adobe ticket. Install it, repair it,
          license it, work around it: hours every week that never felt like they
          were actually fixing anything. So I wrote a PDF app that just works,
          ships as one .exe, and never asks the user to log in.
        stats:
          - 11 languages
          - 12 themes
          - ~16 MB exe

      - name: KillerShell
        slug: killershell
        shots: 4
        screenshot_files: ["01.png", "02.png", "03.png", "04.png"]
        tagline: Free shell for power users
        version: 1.2.2
        released: 2026-08-10
        url: https://killershell.net
        repo: https://github.com/SteveTheKiller/KillerShell
        stack: [C#, WPF, .NET Framework 4.8]
        blurb: >-
          File browser, search, terminal, text editor and admin toolkit in one
          window. Process management, live performance monitor, event viewer,
          registry editor and storage analyzer, each one key away.
        why: >-
          I built KillerShell to optimize my workflow as a technician. It keeps
          the tools and information I use every day in one place, so I am never
          more than a few clicks away from what I need.
        stats:
          - 11 languages
          - 12 themes

      - name: KillerNotes
        slug: killernotes
        shots: 4
        screenshot_files: ["01.png", "02-poster.jpg", "03.png", "04.png"]
        tagline: Free encrypted notepad
        version: 1.2.1
        released: 2026-08-10
        url: https://killernotes.net
        repo: https://github.com/SteveTheKiller/KillerNotes
        stack: [C#, WPF, .NET Framework 4.8, SQLite, SQLCipher]
        blurb: >-
          Notes in one file you own, optionally encrypted at rest with AES-256.
          Offline dictation with local speech recognition, syntax highlighting,
          inline images and recordings, groups, tags and instant search.
        # FILLER, condensed from notes-landing/about.html. Replace with final copy.
        why: >-
          My notes hold client credentials and the keys to a hundred networks. The
          options were cloud notebooks that want an account and sync it somewhere
          you cannot see, or a folder of .txt files with no search and no pictures.
          That belongs in one encrypted file that answers to me.
        stats:
          - AES-256 at rest
          - 11 languages
          - 12 themes

      - name: KillerScan
        slug: killerscan
        shots: 4
        screenshot_files: ["01.png", "02.png", "03.png", "04.png"]
        tagline: Free network scanner
        version: 1.6.1
        released: 2026-08-12
        url: https://killerscan.net
        repo: https://github.com/SteveTheKiller/KillerScan
        stack: [C#, WPF, .NET Framework 4.8]
        blurb: >-
          Scans multiple networks using ARP, ping, port probes, mDNS and SSDP.
          It fingerprints services, identifies MAC vendors, classifies devices,
          opens RDP, SSH and web connections, exports CSV or HTML, and includes
          a headless CLI for scripts and RMM work.
        why: >-
          KillerScan was the first app I built. I made it out of necessity because
          the alternatives were all bad. I use it any time I am on a new network
          and need to see what is plugged in.
        stats:
          - 11 languages
          - 12 themes
          - Headless CLI

      - name: The Killendar
        slug: killendar
        shots: 4
        screenshot_files: ["01.png", "02.png", "03.png", "04.png"]
        tagline: Free encrypted calendar
        version: 1.1.0
        released: 2026-08-10
        url: https://killendar.net
        repo: https://github.com/SteveTheKiller/Killendar
        stack: [C#, WPF, .NET Framework 4.8, SQLite, SQLCipher]
        blurb: >-
          Month, week, day and agenda views with no account, no sync and nothing
          phoning home. Repeating appointments, color categories, iCalendar and
          CSV both ways, optional AES-256 encryption.
        # FILLER, condensed from killendar-landing/about.html. Replace with final copy.
        why: >-
          It started off as a joke. I could not think of a killer feature worth
          releasing it for. Then it occurred to me that being lightweight, and not
          wanting anything from you, might be the feature. Every calendar I could
          have used instead wanted an account, just to remember that the dentist is
          on Thursday.
        stats:
          - AES-256 at rest
          - 11 languages
          - 12 themes

