<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Steve the Killer — Stitched-Frankie smiley (draft)</title>

  <defs>
    <clipPath id="faceClip4">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- L1: background -->
  <g id="L1_background">
    <rect x="0" y="0" width="512" height="512" fill="none"/>
  </g>

  <!-- L2: face -->
  <g id="L2_face">
    <circle cx="256" cy="256" r="220" fill="#F0AC44"/>
  </g>

  <!-- L3: color patch (mismatched face section) -->
  <g id="L3_mismatched_patch" clip-path="url(#faceClip4)">
    <path d="M256,36 L470,180 L470,478 L256,478 Z" fill="#D89532" opacity="0.7"/>
  </g>

  <!-- L4: big diagonal scar across face -->
  <g id="L4_scar_main">
    <path d="M100,180 Q180,210 260,230 Q340,250 420,290"
          stroke="#0D0D0D" stroke-width="6" fill="none"/>
    <!-- X stitches across scar -->
    <g stroke="#0D0D0D" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="170" x2="140" y2="200"/>
      <line x1="140" y1="170" x2="120" y2="200"/>
      <line x1="170" y1="180" x2="190" y2="210"/>
      <line x1="190" y1="180" x2="170" y2="210"/>
      <line x1="220" y1="195" x2="240" y2="225"/>
      <line x1="240" y1="195" x2="220" y2="225"/>
      <line x1="270" y1="210" x2="290" y2="240"/>
      <line x1="290" y1="210" x2="270" y2="240"/>
      <line x1="320" y1="225" x2="340" y2="255"/>
      <line x1="340" y1="225" x2="320" y2="255"/>
      <line x1="370" y1="245" x2="390" y2="275"/>
      <line x1="390" y1="245" x2="370" y2="275"/>
    </g>
  </g>

  <!-- L5: eyes — mismatched (left X, right dot) -->
  <g id="L5_eyes">
    <g id="eye_left_X">
      <line x1="150" y1="255" x2="215" y2="315" stroke="#0D0D0D" stroke-width="16" stroke-linecap="round"/>
      <line x1="215" y1="255" x2="150" y2="315" stroke="#0D0D0D" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g id="eye_right_dot">
      <circle cx="335" cy="285" r="24" fill="#0D0D0D"/>
      <circle cx="342" cy="278" r="6" fill="#EDE6D3"/>
    </g>
  </g>

  <!-- L6: stitched mouth zig-zag -->
  <g id="L6_mouth_stitched">
    <path d="M140,380 L170,395 L200,375 L230,398 L260,378 L290,400 L320,378 L350,398 L380,378"
          stroke="#0D0D0D" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <!-- X stitches along the mouth -->
    <g stroke="#0D0D0D" stroke-width="4" stroke-linecap="round">
      <line x1="150" y1="378" x2="164" y2="398"/>
      <line x1="164" y1="378" x2="150" y2="398"/>
      <line x1="200" y1="378" x2="214" y2="398"/>
      <line x1="214" y1="378" x2="200" y2="398"/>
      <line x1="250" y1="378" x2="264" y2="398"/>
      <line x1="264" y1="378" x2="250" y2="398"/>
      <line x1="300" y1="378" x2="314" y2="398"/>
      <line x1="314" y1="378" x2="300" y2="398"/>
      <line x1="350" y1="378" x2="364" y2="398"/>
      <line x1="364" y1="378" x2="350" y2="398"/>
    </g>
  </g>

  <!-- L7: forehead patch stitch -->
  <g id="L7_forehead_stitches">
    <line x1="220" y1="120" x2="300" y2="120" stroke="#0D0D0D" stroke-width="5"/>
    <g stroke="#0D0D0D" stroke-width="3" stroke-linecap="round">
      <line x1="228" y1="112" x2="238" y2="128"/>
      <line x1="238" y1="112" x2="228" y2="128"/>
      <line x1="258" y1="112" x2="268" y2="128"/>
      <line x1="268" y1="112" x2="258" y2="128"/>
      <line x1="288" y1="112" x2="298" y2="128"/>
      <line x1="298" y1="112" x2="288" y2="128"/>
    </g>
  </g>

  <!-- L8: blood dribble at scar ends -->
  <g id="L8_blood_hints">
    <path d="M100,180 Q95,205 100,225 Q105,215 108,205" fill="#B01E1E"/>
    <path d="M420,290 Q423,315 428,330 Q425,318 424,308" fill="#B01E1E"/>
    <circle cx="380" cy="380" r="3" fill="#B01E1E"/>
    <circle cx="140" cy="378" r="3" fill="#B01E1E"/>
  </g>
</svg>
