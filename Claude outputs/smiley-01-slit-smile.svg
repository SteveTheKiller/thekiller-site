<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Steve the Killer — Slit-Smile smiley (draft)</title>

  <defs>
    <clipPath id="faceClip">
      <path d="M256,36 C 145,36 45,132 42,255 C 40,378 148,478 258,476 C 372,474 470,375 470,258 C 470,142 372,38 256,36 Z"/>
    </clipPath>
  </defs>

  <!-- L1: background (transparent by default; delete or fill in GIMP) -->
  <g id="L1_background">
    <rect x="0" y="0" width="512" height="512" fill="none"/>
  </g>

  <!-- L2: face disc — intentionally irregular, not a perfect circle -->
  <g id="L2_face">
    <path d="M256,36 C 145,36 45,132 42,255 C 40,378 148,478 258,476 C 372,474 470,375 470,258 C 470,142 372,38 256,36 Z" fill="#F0AC44"/>
  </g>

  <!-- L3: face grunge — bites out of the edge and pockmarks on the surface -->
  <g id="L3_face_grunge" clip-path="url(#faceClip)">
    <path d="M35,215 L18,232 L44,248 L22,272 L50,282 L28,302 Z" fill="#1E1410" opacity="0.55"/>
    <path d="M485,180 L470,195 L488,208 L472,225 L486,238 Z" fill="#1E1410" opacity="0.4"/>
    <path d="M120,455 L104,470 L128,478 L112,492 Z" fill="#1E1410" opacity="0.4"/>
    <circle cx="150" cy="150" r="3" fill="#0D0D0D" opacity="0.5"/>
    <circle cx="360" cy="120" r="2.5" fill="#0D0D0D" opacity="0.5"/>
    <circle cx="410" cy="300" r="4" fill="#0D0D0D" opacity="0.45"/>
    <circle cx="110" cy="330" r="3" fill="#0D0D0D" opacity="0.45"/>
    <circle cx="220" cy="430" r="2" fill="#0D0D0D" opacity="0.5"/>
    <circle cx="300" cy="440" r="3.5" fill="#0D0D0D" opacity="0.5"/>
  </g>

  <!-- L4: eyes — X marks, hand-drawn feel (slightly uneven strokes) -->
  <g id="L4_eyes">
    <g id="eye_left">
      <line x1="145" y1="175" x2="215" y2="245" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
      <line x1="215" y1="172" x2="142" y2="248" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
    </g>
    <g id="eye_right">
      <line x1="300" y1="172" x2="368" y2="248" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
      <line x1="370" y1="175" x2="298" y2="245" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>

  <!-- L5: mouth gash — big open wound, layered dark + inner red -->
  <g id="L5_mouth_gash">
    <path d="M120,315 Q170,362 256,376 Q342,362 392,315 L388,342 Q340,402 256,412 Q172,402 124,342 Z"
          fill="#0D0D0D"/>
    <path d="M138,325 Q180,358 256,370 Q332,358 374,325 L372,340 Q332,392 256,402 Q180,392 140,340 Z"
          fill="#7A0A0A"/>
    <!-- teeth suggestion — a few jagged shards -->
    <path d="M175,338 L182,352 L190,338 L198,354 L206,338 L214,352 L222,338 L230,352 L238,338 L246,354 L254,338 L262,352 L270,338 L278,354 L286,338 L294,352 L302,338 L310,354 L318,338 L326,352 L334,338 Z"
          fill="#EDE6D3" opacity="0.85"/>
  </g>

  <!-- L6: blood drips — from the mouth down the face and off the chin -->
  <g id="L6_blood_drips">
    <path d="M172,395 Q170,438 178,478 Q182,468 185,458 Q184,478 190,492 Q192,478 196,464 Q192,438 184,395 Z" fill="#B01E1E"/>
    <path d="M230,405 Q226,460 234,505 Q239,490 241,475 Q242,498 249,510 Q246,490 252,470 Q246,445 240,405 Z" fill="#B01E1E"/>
    <path d="M288,406 Q286,455 292,498 Q297,485 299,472 Q300,493 306,505 Q303,485 309,465 Q303,440 300,406 Z" fill="#B01E1E"/>
    <path d="M340,395 Q338,432 346,465 Q350,455 353,445 Q352,462 358,478 Q360,462 364,450 Q360,432 354,395 Z" fill="#B01E1E"/>
    <!-- pooling drip below chin -->
    <ellipse cx="256" cy="500" rx="14" ry="4" fill="#B01E1E"/>
  </g>

  <!-- L7: spatter — background flecks around the face -->
  <g id="L7_spatter">
    <circle cx="60" cy="440" r="9" fill="#B01E1E"/>
    <circle cx="80" cy="460" r="5" fill="#B01E1E"/>
    <circle cx="95" cy="472" r="3" fill="#B01E1E"/>
    <circle cx="440" cy="420" r="11" fill="#B01E1E"/>
    <circle cx="462" cy="442" r="6" fill="#B01E1E"/>
    <circle cx="478" cy="460" r="3" fill="#B01E1E"/>
    <circle cx="40" cy="360" r="5" fill="#B01E1E"/>
    <circle cx="475" cy="330" r="4" fill="#B01E1E"/>
  </g>
</svg>
