<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Steve the Killer — Peel-Face smiley (draft)</title>

  <defs>
    <clipPath id="faceClip5">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- L1: background -->
  <g id="L1_background">
    <rect x="0" y="0" width="512" height="512" fill="none"/>
  </g>

  <!-- L2: skull layer — the red horror underneath, showing through where face is peeled -->
  <g id="L2_skull_underlayer" clip-path="url(#faceClip5)">
    <circle cx="256" cy="256" r="220" fill="#7A0A0A"/>
    <!-- skull eye socket (right side, revealed by peel) -->
    <ellipse cx="335" cy="230" rx="42" ry="52" fill="#0D0D0D"/>
    <!-- skull teeth on right side -->
    <g fill="#EDE6D3">
      <rect x="290" y="340" width="16" height="30"/>
      <rect x="308" y="340" width="16" height="34"/>
      <rect x="326" y="340" width="16" height="30"/>
      <rect x="344" y="340" width="16" height="34"/>
      <rect x="362" y="340" width="16" height="30"/>
      <rect x="380" y="340" width="16" height="34"/>
    </g>
    <!-- dark gum line -->
    <rect x="285" y="335" width="115" height="8" fill="#0D0D0D"/>
  </g>

  <!-- L3: amber face — but the RIGHT half is torn away, revealing skull -->
  <g id="L3_face_amber_torn">
    <!-- left half of face intact, with jagged tear edge down the middle -->
    <path d="M256,36
             C 145,36 45,132 42,255
             C 40,378 148,478 258,476
             L 250,440 L 265,405 L 245,375 L 260,340
             L 240,300 L 258,260 L 245,225 L 262,195
             L 248,160 L 260,120 L 250,80 Z"
          fill="#F0AC44"/>
    <!-- pockmark grunge on remaining face -->
    <g clip-path="url(#faceClip5)">
      <circle cx="140" cy="150" r="3" fill="#0D0D0D" opacity="0.55"/>
      <circle cx="115" cy="320" r="3.5" fill="#0D0D0D" opacity="0.5"/>
      <circle cx="180" cy="400" r="2.5" fill="#0D0D0D" opacity="0.5"/>
    </g>
  </g>

  <!-- L4: peeled-back flap — the curled sticker hanging off -->
  <g id="L4_peeled_flap">
    <!-- underside of the peel (darker amber) -->
    <path d="M262,195 L275,182 L305,175 L340,178 L378,190 L412,215
             L440,250 L458,295 L462,340 L455,378
             L435,362 L410,330 L385,290 L355,255
             L325,225 L295,205 Z"
          fill="#D89532"/>
    <!-- top of the peel (amber) with rolled edge highlight -->
    <path d="M262,195 L275,182 L305,175 L340,178 L378,190 L412,215 L440,250
             L448,270 L430,258 L400,238 L370,220 L340,208 L310,200 L280,198 Z"
          fill="#F0AC44"/>
    <!-- curl shadow lines -->
    <path d="M275,190 Q320,200 380,225 Q420,245 445,278"
          stroke="#8A5A20" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- small tear-drop drips from the peel underside -->
    <path d="M418,360 Q416,382 422,398 Q425,388 427,378 Q426,395 431,405 Q433,392 436,382 Q432,368 428,360 Z" fill="#B01E1E"/>
    <path d="M455,378 Q453,398 458,412 Q462,402 463,392 Z" fill="#B01E1E"/>
  </g>

  <!-- L5: left eye — still smiley, a single X on the intact amber side -->
  <g id="L5_eye_left">
    <line x1="145" y1="200" x2="215" y2="265" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
    <line x1="215" y1="200" x2="145" y2="265" stroke="#0D0D0D" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- L6: left half of mouth — the intact smiley grin -->
  <g id="L6_mouth_left_half">
    <path d="M130,340 Q170,378 220,388 L250,392 L245,402 L215,404 Q170,398 128,362 Z"
          fill="#0D0D0D"/>
  </g>

  <!-- L7: peel edge highlight / torn seam down the middle -->
  <g id="L7_tear_seam">
    <path d="M250,80 L260,120 L248,160 L262,195 L245,225 L258,260
             L240,300 L260,340 L245,375 L265,405 L250,440 L258,476"
          stroke="#8A5A20" stroke-width="3" fill="none"/>
  </g>

  <!-- L8: spatter and dribbles at bottom -->
  <g id="L8_spatter">
    <circle cx="60" cy="440" r="8" fill="#B01E1E"/>
    <circle cx="82" cy="460" r="4" fill="#B01E1E"/>
    <circle cx="470" cy="450" r="9" fill="#B01E1E"/>
    <ellipse cx="340" cy="500" rx="16" ry="4" fill="#B01E1E"/>
  </g>
</svg>
